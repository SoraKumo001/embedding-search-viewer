name: Release

# Shows in the run list whether a run is a dry run, which only builds and packages
run-name: Release${{ inputs.dry_run == true && ' (dry run)' || '' }}

# Edit version.txt and push to the default branch: if that version has not been released yet, the workflow tags the
# commit (v<version>), builds the app and registers a GitHub release with the packaged app.
# A version that already has a tag or a release is skipped, so unrelated edits to version.txt are harmless.
# To try the pipeline without publishing anything, run it manually (Actions > Release > Run workflow) with "dry_run".

on:
  push:
    branches: [main, master]
    paths:
      - version.txt
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and package only (no tag, no release); the zip is kept as a workflow artifact
        type: boolean
        default: false

permissions:
  contents: write # create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read and validate the version
        id: version
        shell: pwsh
        run: |
          $version = ((Get-Content -Raw version.txt) ?? '').Trim() # an empty file reads as $null
          # 1.2.3 or a pre-release such as 1.2.3-beta.1
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$') {
            throw "version.txt must contain a version like 1.2.3 or 1.2.3-beta.1, but contains '$version'."
          }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version, tag $tag"

      - name: Skip if this version is already released
        id: exists
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $skip = 'false'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { $skip = 'true'; Write-Host "::notice::Release $tag already exists. Nothing to do." }
          elseif (git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>$null) {
            $skip = 'true'
            Write-Host "::warning::Tag $tag already exists without a release. Nothing to do; bump version.txt to publish a new version."
          }
          "skip=$skip" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: Set up .NET
        if: steps.exists.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview # the project targets .NET 11; drop this line once it is generally available

      - name: Cache NuGet packages
        if: steps.exists.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        if: steps.exists.outputs.skip != 'true'
        run: dotnet build EmbeddingSearchViewer.slnx -c Release

      - name: Test
        if: steps.exists.outputs.skip != 'true'
        # Tests that need the AI model skip themselves when it is not installed. The ones that use the Windows PDF
        # renderer and Media Foundation are excluded: server images may lack those components.
        run: dotnet test tests/EmbeddingSearchViewer.Tests/EmbeddingSearchViewer.Tests.csproj -c Release --no-build --filter "Requires!=WindowsMedia"

      - name: Publish
        if: steps.exists.outputs.skip != 'true'
        run: >
          dotnet publish src/EmbeddingSearchViewer.App/EmbeddingSearchViewer.App.csproj
          -c Release -p:Platform=x64 -r win-x64 --self-contained true -o artifacts/publish

      - name: Code Sign
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERT_BASE64) {
            Write-Host "::notice::CODE_SIGNING_PFX_BASE64 secret is not configured; skipping code signing."
            exit 0
          }

          $pfxPath = "$env:RUNNER_TEMP\signing_cert.pfx"
          try {
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            ./tools/Sign-Package.ps1 -TargetPath "artifacts/publish" -PfxPath $pfxPath -Password $env:SIGNING_PASSWORD
          }
          finally {
            if (Test-Path $pfxPath) {
              Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Arrange the package folder
        if: steps.exists.outputs.skip != 'true'
        id: layout
        shell: pwsh
        run: |
          # Top level: the launcher, README, LICENSE and notices; the ~400 files of the app go into app\
          $name = 'EmbeddingSearchViewer-${{ steps.version.outputs.version }}-win-x64'
          ./tools/New-PackageLayout.ps1 -PublishDir artifacts/publish -Destination "artifacts/$name"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup.' }
          }

      - name: Build the installer
        if: steps.exists.outputs.skip != 'true'
        id: installer
        shell: pwsh
        run: |
          $setup = ./tools/Build-Installer.ps1 -PackageDir "artifacts/${{ steps.layout.outputs.name }}" -Version '${{ steps.version.outputs.version }}' -OutputDir artifacts |
            Select-Object -Last 1
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: Code Sign the installer
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERT_BASE64) {
            Write-Host "::notice::CODE_SIGNING_PFX_BASE64 secret is not configured; the installer is not signed."
            exit 0
          }

          $pfxPath = "$env:RUNNER_TEMP\signing_cert.pfx"
          try {
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            ./tools/Sign-Package.ps1 -TargetPath '${{ steps.installer.outputs.setup }}' -PfxPath $pfxPath -Password $env:SIGNING_PASSWORD
          }
          finally {
            if (Test-Path $pfxPath) {
              Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Package
        if: steps.exists.outputs.skip != 'true'
        id: package
        shell: pwsh
        run: |
          $name = '${{ steps.layout.outputs.name }}'
          Compress-Archive -Path "artifacts/$name" -DestinationPath "artifacts/$name.zip" -CompressionLevel Optimal
          $setupPath = '${{ steps.installer.outputs.setup }}'
          $setupName = Split-Path -Leaf $setupPath
          $zipHash = (Get-FileHash "artifacts/$name.zip" -Algorithm SHA256).Hash.ToLower()
          $setupHash = (Get-FileHash $setupPath -Algorithm SHA256).Hash.ToLower()
          @("$zipHash  $name.zip", "$setupHash  $setupName") | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
          "zip=artifacts/$name.zip" >> $env:GITHUB_OUTPUT
          Write-Host ("{0}  ({1:N0} MB)" -f "$name.zip", ((Get-Item "artifacts/$name.zip").Length / 1MB))
          Write-Host ("{0}  ({1:N0} MB)" -f $setupName, ((Get-Item $setupPath).Length / 1MB))

      - name: Keep the package (dry run only)
        if: steps.exists.outputs.skip != 'true' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: EmbeddingSearchViewer-${{ steps.version.outputs.version }}-win-x64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.installer.outputs.setup }}
            artifacts/SHA256SUMS.txt
          retention-days: 7

      - name: Create the tag and the release
        if: steps.exists.outputs.skip != 'true' && inputs.dry_run != true
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          @"
          Windows (x64) 用のアプリです。次のどちらかで、使えます。

          - **インストーラー**（``EmbeddingSearchViewer-<バージョン>-win-x64-setup.exe``）: 実行すると、スタートメニューに登録されます（管理者権限は不要です）。
          - **zip**（``EmbeddingSearchViewer-<バージョン>-win-x64.zip``）: 展開して、一番上の ``EmbeddingSearchViewer.cmd`` を、ダブルクリックします（アプリ本体は、``app`` フォルダの中です）。

          - 初回起動時に、AI モデル（約 1.76 GB）をアプリ内でダウンロードします。
          - ``SHA256SUMS.txt`` で、zip とインストーラーのチェックサムを確認できます。
          - 署名がないため、Windows の SmartScreen の警告が出ることがあります（対処は、同梱の ``README.md`` を参照してください）。
          - 動作環境と使い方は、同梱の ``README.md``（日本語）と ``README.en.md``（English）を参照してください。
          - 表示言語は、日本語と English です（「設定」→「言語」。既定は、Windows の表示言語に合わせます）。
          - このアプリは MIT ライセンスです（同梱の ``LICENSE``）。サードパーティのライセンスは、``THIRD-PARTY-NOTICES.md`` と ``licenses/`` にまとめています。

          ---

          A Windows (x64) app. Use either of these:

          - **Installer** (``EmbeddingSearchViewer-<version>-win-x64-setup.exe``): run it and the app is added to the Start menu (no administrator rights needed).
          - **zip** (``EmbeddingSearchViewer-<version>-win-x64.zip``): extract it and double-click ``EmbeddingSearchViewer.cmd`` at the top (the app itself is in the ``app`` folder).

          - On the first start the app downloads the AI model (about 1.76 GB).
          - ``SHA256SUMS.txt`` has the checksums of the zip and the installer.
          - The files are not code-signed, so Windows SmartScreen may show a warning (see the bundled ``README.en.md`` for what to do).
          - System requirements and usage: see the bundled ``README.en.md`` (English) and ``README.md`` (Japanese).
          - The app is available in Japanese and English ("Settings" → "Language"; by default it follows the display language of Windows).
          - The app is under the MIT License (the bundled ``LICENSE``). The licenses of the third-party software are in ``THIRD-PARTY-NOTICES.md`` and ``licenses/``.
          "@ | Set-Content -Encoding utf8 artifacts/release-notes.md

          $ghArgs = @(
            $tag, '${{ steps.package.outputs.zip }}', '${{ steps.installer.outputs.setup }}', 'artifacts/SHA256SUMS.txt',
            '--target', $env:GITHUB_SHA,          # creates the tag on this commit
            '--title', $tag,
            '--notes-file', 'artifacts/release-notes.md',
            '--generate-notes'                    # appends the changes since the previous release
          )
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' } else { $ghArgs += '--latest' }
          gh release create @ghArgs
