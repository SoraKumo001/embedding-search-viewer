[project]
name = "embedding-sidecar"
version = "0.1.0"
description = "EmbeddingGemma 2 Multimodal FastAPI Sidecar for EmbeddingSearchViewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "sentence-transformers>=3.3.0",
    "transformers>=4.46.0",
    "torch>=2.4.0",
    "pillow>=10.4.0",
    "soundfile>=0.12.1",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.12",
    "torchvision",
    "onnx>=1.23.2",
    "optimum>=2.3.0",
    "onnxscript>=0.7.2",
]

[tool.uv]
package = false
